name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [3.10, 3.11, 3.12]  # add 3.13 later when deps are ready
    steps:
      - uses: actions/checkout@v4

      # (Optional) Only if you truly need these system libs
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libtirpc-dev

      # Prefer the official action for R if you actually run R code in CI.
      # Remove this whole block if R isn't needed for the CI step.
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml
            poetry.lock
            requirements/**/*.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          # If using pyproject:
          # pip install -e .

      # If you need R package deps, uncomment:
      # - uses: r-lib/actions/setup-r-dependencies@v2
      #   with:
      #     extra-packages: |
      #       any::testthat
      #     needs: check

      - name: Run tests
        run: |
          pytest -q  # or your test command
