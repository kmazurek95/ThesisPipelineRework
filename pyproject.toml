[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ThesisPipelineRework"
version = "0.1.0"
description = """
Pipeline to collect, process, and classify Congressional Record transcripts (CREC) 
for analyzing interest group prominence in U.S. politics.
"""
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Kaleb Mazurek", email = "kalebmazurek@gmail.com" }
]
requires-python = ">=3.10"

# Core dependencies: collection, parsing, preprocessing, ML
dependencies = [
  "requests>=2.31.0",
  "beautifulsoup4>=4.12",
  "lxml>=4.9",
  "tqdm>=4.66",
  "retrying>=1.3.4",
  "pandas>=2.1",
  "numpy>=1.26",
  "scikit-learn>=1.3",
  "nltk>=3.8",
  "readability-lxml>=0.8",
  "python-dotenv>=1.0",
  "joblib>=1.3",
  "eli5>=0.13",
  "xgboost>=2.0",
  "lightgbm>=4.0",
  "imbalanced-learn>=0.11",
  "regex>=2023.10",
]

[project.optional-dependencies]
# Development dependencies for linting, testing, and type checking
dev = [
  "black>=23.0",
  "flake8>=6.0",
  "pytest>=7.0",
  "mypy>=1.0",
]

# Documentation dependencies for building project docs
docs = [
  "sphinx>=7.0",
  "sphinx-rtd-theme>=1.3",
]

[tool.setuptools.packages.find]
where = ["."]  # Search for packages in the current directory
include = ["ThesisPipelineRework*"]  # Include all submodules under ThesisPipelineRework

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
  "tests",  # Directory containing test files
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
